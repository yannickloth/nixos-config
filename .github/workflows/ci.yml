name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per ref. A new push cancels the superseded run instead of leaving it
# queued behind a 14 GB runner that is already out of disk space.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Cheap and always-green: syntax-parse every tracked Nix file. Catches
  # merge-conflict markers / syntax errors without fetching any flake input.
  nix-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Parse all Nix files
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.nix')
          echo "Parsing ${#files[@]} Nix files"
          for f in "${files[@]}"; do
            nix-instantiate --parse "$f" >/dev/null
          done

  # Report-only until the dead-code and anti-pattern cleanups land (see
  # ops/plans/2026-10-02-nixos-config-review.md). Flip continue-on-error off
  # once these are green.
  nix-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      # Report-only (per step, so a statix failure still lets deadnix report).
      - name: statix
        continue-on-error: true
        run: nix run nixpkgs#statix -- check .

      - name: deadnix
        continue-on-error: true
        run: nix run nixpkgs#deadnix -- --fail .

  # Evaluation gate. Every NixOS host is evaluated to a toplevel drvPath, one
  # process at a time. No system closure is built.
  #
  # Why not `nix flake check`: it evaluates all five hosts concurrently (memory
  # spike on a 16 GB runner) and, without --no-build, materialises system
  # closures. `--no-build` cannot be used either: uv2nix reads pyproject.toml
  # and uv.lock from the hermes-agent source during evaluation, so Nix must
  # realise that source fetch; with --no-build it reports
  # "path '...-source.drv' is not valid".
  #
  # Evaluation is what catches the defects this repo actually produces
  # (duplicate option definitions, conflicting kernelPackages, broken module
  # references). The bounded builds live in `checks-scripts` below.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Evaluate every host
        run: |
          set -euo pipefail
          hosts=(laptop-xps laptop-hera laptop-p16 desktop-leto server-nike)
          for h in "${hosts[@]}"; do
            echo "::group::${h}"
            drv=$(nix eval --raw ".#nixosConfigurations.${h}.config.system.build.toplevel.drvPath")
            echo "${h} -> ${drv##*/}"
            echo "::endgroup::"
          done

  # Bounded build gate: the pure script checks plus the two generated-artifact
  # checks. `hosts-eval` is excluded: it only writes five toplevel drvPaths,
  # which the evaluation job above already computes for every host.
  checks-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Build the script checks
        run: |
          nix build --no-link --keep-going \
            .#checks.x86_64-linux.unit \
            .#checks.x86_64-linux.scripts-syntax \
            .#checks.x86_64-linux.apparmor-parse \
            .#checks.x86_64-linux.printing-script \
            .#checks.x86_64-linux.parse-all \
            .#checks.x86_64-linux.python-compile \
            .#checks.x86_64-linux.age-secrets \
            .#checks.x86_64-linux.snapshots \
            .#checks.x86_64-linux.strata-fail-closed

  # Standalone home-manager flake (CachyOS deployment): evaluation of the four
  # users plus the CachyOS-only SSH key bootstrap script.
  checks-users:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Nix flake checks (standalone home-manager)
        run: nix flake check ./users --keep-going
