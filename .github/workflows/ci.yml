name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Cheap and always-green: syntax-parse every tracked Nix file. Catches
  # merge-conflict markers / syntax errors without fetching any flake input.
  nix-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v4

      - name: Parse all Nix files
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.nix')
          echo "Parsing ${#files[@]} Nix files"
          for f in "${files[@]}"; do
            nix-instantiate --parse "$f" >/dev/null
          done

  # Report-only until the dead-code and anti-pattern cleanups land (see
  # ops/plans/2026-10-02-nixos-config-review.md). Flip continue-on-error off
  # once these are green.
  nix-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v4

      # Report-only (per step, so a statix failure still lets deadnix report).
      - name: statix
        continue-on-error: true
        run: nix run nixpkgs#statix -- check .

      - name: deadnix
        continue-on-error: true
        run: nix run nixpkgs#deadnix -- --fail .

  # Evaluate each host's toplevel derivation: catches eval / module / option /
  # merge errors without building the full closure.
  #
  # The flake has a private `git+ssh://…forksStrata` input that CI cannot fetch
  # (no deploy key on hosted runners), so override it with the public upstream
  # for evaluation only. To evaluate the exact fork instead, add a deploy key
  # as a repo secret and set up ssh-agent, then drop the --override-input.
  eval-hosts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [laptop-xps, laptop-hera, laptop-p16]
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v4

      - name: Eval host config
        run: |
          nix eval --accept-flake-config \
            --override-input forksStrata github:Niko1221/Strata \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel.drvPath"
