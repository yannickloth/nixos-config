name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Cheap and always-green: syntax-parse every tracked Nix file. Catches
  # merge-conflict markers / syntax errors without fetching any flake input.
  nix-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Parse all Nix files
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.nix')
          echo "Parsing ${#files[@]} Nix files"
          for f in "${files[@]}"; do
            nix-instantiate --parse "$f" >/dev/null
          done

  # Report-only until the dead-code and anti-pattern cleanups land (see
  # ops/plans/2026-10-02-nixos-config-review.md). Flip continue-on-error off
  # once these are green.
  nix-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      # Report-only (per step, so a statix failure still lets deadnix report).
      - name: statix
        continue-on-error: true
        run: nix run nixpkgs#statix -- check .

      - name: deadnix
        continue-on-error: true
        run: nix run nixpkgs#deadnix -- --fail .

  # All host-level checks in one job: evaluation of the three hosts, the pure
  # helpers (nix-unit), generated-config snapshots (namaka), generated shell
  # scripts (bash -n + shellcheck), AppArmor profiles, the strata patcher
  # (compile + fail-closed behaviour) and syntax parsing.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Nix flake checks
        run: nix flake check --keep-going

  # Standalone home-manager flake (CachyOS deployment): evaluation of the four
  # users plus the CachyOS-only SSH key bootstrap script.
  checks-users:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Nix flake checks (standalone home-manager)
        run: nix flake check ./users --keep-going
