# Strata's expert arena is one ~40 GiB mmap with MAP_HUGETLB|MAP_HUGE_2MB, and
# the pool must cover the WHOLE mapping (all-or-nothing) or the engine falls
# back to 4 KiB pages (pinned.cu). The IQ3_XXS arena is 39.97 GiB = 20465 pages;
# 22528 = 44 GiB leaves headroom. Applied by systemd-sysctl early at boot,
# before Strata loads, so the reservation does not fight a live pinned arena.
vm.nr_hugepages = 22528
